<html lang="jp">

        <meta charset="utf-8" />

        <meta name="author" content="ハチ" />

        <link rel="shortcut icon" href="favicon.svg">
    </head>
    <body>
        <header>
            <div class="logo">
                <a href="index.html" style="color: white; text-decoration: none">Trinity Library</a>
            </div>
        </header>
        <nav>
            <a href="index.html">Home</a>
            <a href="list.html">Book List</a>
            <a href="sns.html">SNS</a>
            <a href="about.html">About</a>
        </nav>
        <main>
            <span class="doc-id" id="doc-id">DOC_TYPE: ARTICLE / REF_NO: 775</span>
            <h1 id="article-title"></h1>
            <article>
                <div id="article-content" class="novel"></div>
            </article>
        </main>
        <footer>
            このページは主にBlueArchiveの二次創作であり，公式を模す意図はありません．
        </footer>

        <script>
            window.addEventListener("DOMContentLoaded", () => {
                const params = new URLSearchParams(window.location.search);
                const articleId = params.get("id");

                const titleElement = document.getElementById("article-title");
                const contentElement =
                    document.getElementById("article-content");

                if (!articleId) {
                    titleElement.textContent = "Error";
                    contentElement.innerHTML = `<p class="error">No article ID provided. Please use a URL like <code>article.html?id=1</code></p>`;
                    return;
                }

                fetch(`articles/${articleId}.txt`)
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(
                                `Article not found. The file <code>articles/${articleId}.txt</code> does not exist.`,
                            );
                        }
                        return response.text();
                    })
                    .then((text) => {
                        const lines = text.split("\n");
                        const title = lines[0];
                        const preformattedContent = lines.slice(1).join("\n");

                        document.title = title;
                        titleElement.textContent = title;

                        const preElement = document.createElement("ref-content");
                        preElement.textContent = preformattedContent;
                        preElement.style.whiteSpace = "pre-wrap";

                        // Use the styled <pre> equivalent class or structure
                        const container = document.createElement("pre");
                        container.textContent = preformattedContent;
                        container.style.whiteSpace = "pre-wrap";
                        container.style.wordBreak = "break-all";
                        container.style.overflowWrap = "break-word";

                        contentElement.innerHTML = "";
                        contentElement.appendChild(container);
                    })
                    .catch((error) => {
                        console.error("Error fetching article:", error);
                        titleElement.textContent = "Error";
                        contentElement.innerHTML = `<p class="error">${error.message}</p>`;
                    });
            });
        </script>

    </body>
</html>
